<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛡️ 異常觀測中心</title>
  <style>
    :root { --bg: #111; --text: #eee; --accent: #e74c3c; --card: #1e1e1e; }
    body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 15px; margin: 0; }
    .card { background: var(--card); padding: 20px; border-radius: 12px; width: 100%; max-width: 800px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { font-size: 22px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 15px; }
    
    .rules { background: #000; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 15px; line-height: 1.6; color: #bbb; border: 1px solid #444; }
    .rules b { color: var(--accent); }

    .game-box { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .header { font-size: 14px; color: #777; text-align: center; margin-bottom: 8px; }
    .drop-zone { background: #151515; border: 2px dashed #333; border-radius: 10px; min-height: 400px; padding: 10px; transition: 0.2s; }
    #anomaly-zone { border-color: #444; }
    
    .drag-item { background: #2c2c2c; border: 1px solid #444; border-radius: 6px; padding: 15px; margin-bottom: 10px; font-size: 16px; cursor: grab; line-height: 1.4; }
    .dragging { opacity: 0.3; background: #333; }
    
    input, button { width: 100%; padding: 12px; margin: 5px 0; background: #000; color: #fff; border: 1px solid #444; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
    button { background: var(--accent); border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-blue { background: #2980b9; }
    .hidden { display: none; }
    .result-text { font-size: 18px; text-align: center; padding: 20px; white-space: pre-line; }
    
    @media (max-width: 600px) { .game-box { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="card">
  <h1>🛡️ 異常觀測中心</h1>

  <div id="rules-box" class="rules hidden">
    <b>[任務說明]</b><br>
    抓出含有「<b>閉眼、回頭、紅色、老闆笑</b>」的怪事卡片，並拖移到右邊隔離區。
  </div>

  <div id="step-1">
    <p>請輸入三個地點：</p>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="l1" placeholder="例如：大門口">
      <input type="text" id="l2" placeholder="例如：飲水機">
      <input type="text" id="l3" placeholder="例如：合作社">
    </div>
    <button onclick="startGame()">開始掃描</button>
  </div>

  <div id="loading" class="hidden" style="text-align: center; padding: 20px;">🌀 正在攔截不明訊號...</div>

  <div id="step-2" class="hidden">
    <div class="game-box">
      <div>
        <div class="header">📡 正常訊號</div>
        <div id="safe-zone" class="drop-zone"></div>
      </div>
      <div>
        <div class="header">⚠️ 隔離區 (污染)</div>
        <div id="anomaly-zone" class="drop-zone"></div>
      </div>
    </div>
    <button onclick="submit()">提交隔離報告</button>
  </div>

  <div id="step-3" class="hidden">
    <div id="result" class="result-text"></div>
    <button id="ans-btn" class="btn-blue" onclick="showAns()">👁️ 查看污染源</button>
    <div id="ans-list" class="hidden" style="padding:15px; background:#111; border-radius:8px; font-size:14px; color:#999; margin-top:10px;"></div>
    <button onclick="location.reload()" style="background:#444;">再次校準</button>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzayFJr6SkKnlLyIE8sYh7bBliVBfDC-PzTf6tpQ04rPBsjrEOkvOx-L64tIynfUe6_/exec"; 
  let errorCards = [];

  async function startGame() {
    const l = [document.getElementById('l1').value, document.getElementById('l2').value, document.getElementById('l3').value];
    if(l.some(x => !x)) return alert('地點要填完整喔！');

    document.getElementById('step-1').classList.add('hidden');
    document.getElementById('loading').classList.remove('hidden');

    try {
      const response = await fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action: "generate", landmarks: l }) });
      const res = await response.json();
      const data = res.data;

      const rawItems = data.split('|').map(s => s.trim()).filter(s => s.length > 0);
      errorCards = rawItems.filter(s => s.includes("(ERROR)")).map(s => s.replace("(ERROR)", "").trim());
      const displayItems = rawItems.map(s => s.replace("(ERROR)", "").trim()).sort(() => Math.random() - 0.5);

      renderCards(displayItems);
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('rules-box').classList.remove('hidden');
      document.getElementById('step-2').classList.remove('hidden');
    } catch(e) { alert('訊號連線失敗！'); location.reload(); }
  }

  function renderCards(items) {
    const safe = document.getElementById('safe-zone');
    safe.innerHTML = '';
    items.forEach(txt => {
      const el = document.createElement('div');
      el.className = 'drag-item';
      el.draggable = true;
      el.innerText = txt;
      el.ondragstart = () => el.classList.add('dragging');
      el.ondragend = () => el.classList.remove('dragging');
      safe.appendChild(el);
    });

    document.querySelectorAll('.drop-zone').forEach(zone => {
      zone.ondragover = (e) => e.preventDefault();
      zone.ondrop = () => {
        const dragging = document.querySelector('.dragging');
        if (dragging) zone.appendChild(dragging);
      };
    });
  }

  async function submit() {
    const chosen = [...document.getElementById('anomaly-zone').querySelectorAll('.drag-item')].map(i => i.innerText).join(' ; ');
    document.getElementById('step-2').classList.add('hidden');
    document.getElementById('loading').classList.remove('hidden');

    const response = await fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action: "verify", playerChoices: chosen, correctAnswers: errorCards.join('|') }) });
    const res = await response.json();

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('step-3').classList.remove('hidden');
    document.getElementById('result').innerText = res.data;
  }

  function showAns() {
    const list = document.getElementById('ans-list');
    list.classList.remove('hidden');
    list.innerHTML = "<b>正確的污染源：</b><br>" + errorCards.join("<br>");
    document.getElementById('ans-btn').classList.add('hidden');
  }
</script>
</body>
</html>
