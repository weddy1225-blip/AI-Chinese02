<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root { --primary: #e67e22; --bg: #f5f6fa; }
    body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
    .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
    h1 { text-align: center; color: #2c3e50; }
    .input-group { margin-bottom: 15px; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
    button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    button:hover { background: #d35400; transform: translateY(-2px); }
    #loading { display: none; text-align: center; margin-top: 20px; color: #666; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    .result-area { display: none; margin-top: 20px; border-top: 2px dashed #ddd; padding-top: 20px; }
    textarea { width: 100%; height: 120px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
  </style>
</head>
<body>

<div class="card">
  <h1>🛡️ 導航修復作戰</h1>
  
  <div id="setup-step">
    <p>👨‍👩‍👧 家長請輸入觀察地標：</p>
    <div class="input-group"><input type="text" id="l1" placeholder="地標 1 (如：門口電線桿)"></div>
    <div class="input-group"><input type="text" id="l2" placeholder="地標 2 (如：早餐店)"></div>
    <div class="input-group"><input type="text" id="l3" placeholder="地標 3 (如：變電箱)"></div>
    
    <p>選擇戰場模式：</p>
    <select id="mode">
      <option value="古代穿越">⚔️ 古代穿越</option>
      <option value="外星入侵">🛸 外星入侵</option>
      <option value="現代寫實">🏙️ 現代寫實</option>
    </select>
    
    <button onclick="startQuest()">啟動傳送門</button>
  </div>

  <div id="loading">🌀 正在扭曲現實空間...</div>

  <div id="repair-step" class="result-area">
    <h3>⚠️ 偵測到故障指令：</h3>
    <p id="broken-text" style="color: #c0392b; background: #fee; padding: 10px; border-radius: 5px;"></p>
    <p>🛠️ <b>修復師，請更正為安全的導航：</b></p>
    <textarea id="fixed-text" placeholder="在這裡重新撰寫正確的描述..."></textarea>
    <button onclick="submitRepair()">提交修復成果</button>
  </div>
</div>

<script>
  function startQuest() {
    const l1 = document.getElementById('l1').value;
    const l2 = document.getElementById('l2').value;
    const l3 = document.getElementById('l3').value;
    const mode = document.getElementById('mode').value;

    if (!l1 || !l2 || !l3) { alert('請填寫所有地標！'); return; }

    document.getElementById('setup-step').style.display = 'none';
    document.getElementById('loading').style.display = 'block';

    // 關鍵修正：確保 google.script.run 存在
    if (typeof google !== 'undefined') {
      google.script.run
        .withSuccessHandler(onAISuccess)
        .withFailureHandler(onAIFail)
        .processAIRequest([l1, l2, l3], mode);
    } else {
      alert('錯誤：找不到 Google Script 環境。請確保是透過部署網址開啟！');
      document.getElementById('setup-step').style.display = 'block';
      document.getElementById('loading').style.display = 'none';
    }
  }

  function onAISuccess(response) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('repair-step').style.display = 'block';
    document.getElementById('broken-text').innerText = response;
  }

  function onAIFail(err) {
    alert('AI 傳送失敗：' + err);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('setup-step').style.display = 'block';
  }

  function submitRepair() {
    alert('✅ 修復完成！請交給 AI 指揮官（家長）進行最後評分。');
    location.reload(); // 簡單重置
  }
</script>

</body>
</html>
