<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>🛡️ 異常觀測修復中心</title>
  <style>
    :root { --bg: #0d0d0d; --text: #d1d1d1; --accent: #ff3e3e; --card-bg: #1a1a1a; }
    body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; margin: 0; }
    .card { background: var(--card-bg); padding: 30px; border-radius: 12px; width: 95%; max-width: 1000px; border: 1px solid #333; }
    h1 { color: var(--accent); text-align: center; border-bottom: 1px solid #444; padding-bottom: 15px; }
    .rules-panel { background: #000; padding: 20px; border: 1px solid var(--accent); border-radius: 8px; margin-bottom: 25px; }
    .game-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .drop-zone { background: rgba(255,255,255,0.02); border: 2px dashed #444; border-radius: 10px; min-height: 400px; padding: 15px; }
    .drag-item { background: #2a2a2a; border: 1px solid #444; padding: 15px; margin-bottom: 10px; cursor: grab; border-radius: 6px; }
    .dragging { opacity: 0.3; }
    input, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 6px; border: 1px solid #444; background: #111; color: #fff; box-sizing: border-box; }
    button { background: var(--accent); cursor: pointer; font-weight: bold; }
    .hidden { display: none; }
    .answer-box { background: #222; padding: 15px; border-left: 4px solid #3498db; margin-top: 15px; }
  </style>
</head>
<body>

<div class="card">
  <h1>🛡️ 異常觀測修復中心</h1>

  <div id="step-1">
    <p>輸入三個地標：</p>
    <input type="text" id="l1" placeholder="地標 1">
    <input type="text" id="l2" placeholder="地標 2">
    <input type="text" id="l3" placeholder="地標 3">
    <button onclick="startGame()">啟動觀測儀</button>
  </div>

  <div id="loading" class="hidden">🌀 正在連線至觀測終端...</div>

  <div id="step-2" class="hidden">
    <div class="rules-panel">
      <strong>📜 觀測手則：</strong> 隔離包含「閉眼、回頭、紅色、老闆笑」的卡片。
    </div>
    <div class="game-container">
      <div id="safe-zone" class="drop-zone"></div>
      <div id="anomaly-zone" class="drop-zone" style="border-color: var(--accent);"></div>
    </div>
    <button onclick="submitReport()">提交報告</button>
  </div>

  <div id="step-3" class="hidden">
    <div id="result" style="font-size: 20px; text-align: center; padding: 20px;"></div>
    <button onclick="showAnswers()" style="background:#3498db;">查看感染源清單</button>
    <div id="answer-list" class="hidden answer-box"></div>
    <button onclick="location.reload()" style="background:#444;">重新校準</button>
  </div>
</div>

<script>
  // 🔗 ⚠️ 請替換成你部署好的 GAS 網址
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzayFJr6SkKnlLyIE8sYh7bBliVBfDC-PzTf6tpQ04rPBsjrEOkvOx-L64tIynfUe6_/exec"; 

  let errorCards = [];

  async function apiCall(data) {
    const response = await fetch(GAS_URL, {
      method: "POST",
      body: JSON.stringify(data)
    });
    const res = await response.json();
    return res.data;
  }

  async function startGame() {
    const l = [document.getElementById('l1').value, document.getElementById('l2').value, document.getElementById('l3').value];
    if(l.some(x => !x)) return alert("請填寫完整");

    document.getElementById('step-1').classList.add('hidden');
    document.getElementById('loading').classList.remove('hidden');

    const res = await apiCall({ mode: "generate", landmarks: l });
    const rawItems = res.split('|').map(s => s.trim()).filter(s => s.length > 0);
    
    errorCards = rawItems.filter(s => s.includes("(ERROR)")).map(s => s.replace("(ERROR)", "").trim());
    const displayItems = rawItems.map(s => s.replace("(ERROR)", "").trim()).sort(() => Math.random() - 0.5);

    renderCards(displayItems);
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('step-2').classList.remove('hidden');
  }

  function renderCards(items) {
    const zone = document.getElementById('safe-zone');
    items.forEach(text => {
      const el = document.createElement('div');
      el.className = 'drag-item';
      el.draggable = true;
      el.innerText = text;
      el.onsignals = e => e.preventDefault();
      el.addEventListener('dragstart', () => el.classList.add('dragging'));
      el.addEventListener('dragend', () => el.classList.remove('dragging'));
      zone.appendChild(el);
    });

    document.querySelectorAll('.drop-zone').forEach(zone => {
      zone.addEventListener('dragover', e => {
        e.preventDefault();
        const dragging = document.querySelector('.dragging');
        zone.appendChild(dragging);
      });
    });
  }

  async function submitReport() {
    const chosen = [...document.getElementById('anomaly-zone').querySelectorAll('.drag-item')].map(i => i.innerText).join(' ; ');
    document.getElementById('step-2').classList.add('hidden');
    document.getElementById('loading').classList.remove('hidden');

    const result = await apiCall({ mode: "verify", playerChoices: chosen, correctAnswers: errorCards.join('|') });
    
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('step-3').classList.remove('hidden');
    document.getElementById('result').innerText = result;
  }

  function showAnswers() {
    const list = document.getElementById('answer-list');
    list.classList.remove('hidden');
    list.innerHTML = "<strong>感染源：</strong><br>" + errorCards.join("<br>");
  }
</script>
</body>
</html>
