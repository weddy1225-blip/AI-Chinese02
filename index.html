<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root { --bg: #0d0d0d; --text: #d1d1d1; --accent: #ff3e3e; --card-bg: #1a1a1a; }
    body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; }
    .card { background: var(--card-bg); padding: 30px; border-radius: 12px; width: 95%; max-width: 1100px; border: 1px solid #333; box-shadow: 0 0 40px rgba(0,0,0,0.8); }
    
    h1 { color: var(--accent); letter-spacing: 5px; text-align: center; border-bottom: 1px solid #444; padding-bottom: 20px; margin-bottom: 30px; }

    /* 規則區 */
    .rules-panel { background: #000; padding: 20px; border: 1px solid var(--accent); border-radius: 8px; margin-bottom: 30px; }
    .rules-title { color: var(--accent); font-weight: bold; margin-bottom: 10px; font-size: 18px; text-transform: uppercase; }
    .rules-list { color: #aaa; font-size: 16px; line-height: 1.8; }

    /* 遊戲佈局 */
    .game-container { display: grid; grid-template-columns: 1fr 1fr; gap: 35px; }
    .zone-header { font-size: 16px; margin-bottom: 15px; color: #888; text-align: center; font-weight: bold; }
    .drop-zone { background: rgba(255,255,255,0.02); border: 2px dashed #444; border-radius: 12px; min-height: 520px; padding: 20px; transition: 0.3s; }
    
    #anomaly-zone { border-color: var(--accent); background: rgba(255, 77, 77, 0.03); }
    
    /* 卡片樣式 */
    .drag-item { 
      background: #2a2a2a; border: 1px solid #444; border-radius: 8px; padding: 20px; margin-bottom: 15px;
      font-size: 18px; cursor: grab; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); line-height: 1.5;
    }
    .drag-item:active { cursor: grabbing; }
    .dragging { opacity: 0.1; transform: scale(0.95); }

    /* 表單元件 */
    input, select, button { width: 100%; padding: 15px; margin: 10px 0; background: #111; color: #fff; border: 1px solid #333; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
    button { background: var(--accent); border: none; font-weight: bold; cursor: pointer; font-size: 18px; transition: 0.3s; }
    button:hover { filter: brightness(1.2); }
    .btn-info { background: #3498db; margin-top: 15px; }
    
    .hidden { display: none; }
    .answer-box { text-align:left; margin-top:20px; padding:20px; background:#222; border-left:4px solid #3498db; color: #fff; line-height: 1.8; border-radius: 0 8px 8px 0; }
  </style>
</head>
<body>

<div class="card">
  <h1>🛡️ 異常觀測修復中心</h1>

  <div id="rules-display" class="rules-panel hidden">
    <div class="rules-title">📜 觀測員生存手則</div>
    <div class="rules-list">
      ● 正常訊號中<strong>絕不會</strong>出現以下狀態：<br>
      &nbsp;&nbsp;「閉著眼睛」、「回頭觀看」、「紅色的事物」、「老闆在笑」。<br>
      ● 請檢視 6 組情境卡片，將包含上述「污染狀態」的卡片移至右側隔離區。
    </div>
  </div>

  <div id="step-1">
    <p>請輸入目標坐標地標：</p>
    <div style="display: flex; gap: 15px;">
      <input type="text" id="l1" placeholder="地標 A">
      <input type="text" id="l2" placeholder="地標 B">
      <input type="text" id="l3" placeholder="地標 C">
    </div>
    <select id="mode">
      <option value="深夜街道">🌌 深夜街道</option>
      <option value="廢棄醫院">🏥 廢棄醫院</option>
      <option value="深夜學校">🏫 深夜學校</option>
      <option value="荒野大霧">🌫️ 荒野大霧</option>
    </select>
    <button onclick="start()">啟動情境觀測儀</button>
  </div>

  <div id="loading" class="hidden">🌀 正在過濾時空雜訊...</div>

  <div id="step-2" class="hidden">
    <div class="game-container">
      <div>
        <div class="zone-header">📡 原始觀測訊號</div>
        <div id="safe-zone" class="drop-zone"></div>
      </div>
      <div>
        <div class="zone-header">⚠️ 異常隔離區 (僅放污染源)</div>
        <div id="anomaly-zone" class="drop-zone"></div>
      </div>
    </div>
    <button onclick="submit()">提交隔離報告</button>
  </div>

  <div id="step-3" class="hidden">
    <div id="result" style="font-size: 22px; padding: 35px; background: #000; border: 1px solid #444; border-radius: 8px; text-align: center; white-space: pre-line;"></div>
    <button id="show-answer-btn" class="btn-info" onclick="revealAnswers()">👁️ 查看受感染卡片清單</button>
    <div id="answer-list" class="hidden answer-box"></div>
    <button onclick="location.reload()" style="margin-top:25px; background:#444;">再次執行任務</button>
  </div>
</div>

<script>
  let errorCards = []; // 儲存正確答案

  function start() {
    const l = [document.getElementById('l1').value, document.getElementById('l2').value, document.getElementById('l3').value];
    if(l.some(x => !x)) return alert('請填寫完整地標資料');
    
    document.getElementById('step-1').classList.add('hidden');
    document.getElementById('loading').classList.remove('hidden');

    google.script.run.withSuccessHandler(res => {
      const rawItems = res.split('|').map(s => s.trim()).filter(s => s.length > 0);
      
      // 提取標記並清理文字
      errorCards = rawItems.filter(s => s.includes("(ERROR)")).map(s => s.replace("(ERROR)", "").trim());
      const displayItems = rawItems.map(s => s.replace("(ERROR)", "").trim());

      setup(displayItems);
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('rules-display').classList.remove('hidden');
      document.getElementById('step-2').classList.remove('hidden');
    }).processAIRequest(l, document.getElementById('mode').value);
  }

  function setup(items) {
    const safeZone = document.getElementById('safe-zone');
    safeZone.innerHTML = '';
    // 隨機打亂卡片顯示順序
    items.sort(() => Math.random() - 0.5);
    
    items.forEach(text => {
      const el = document.createElement('div');
      el.className = 'drag-item';
      el.draggable = true;
      el.innerText = text;
      el.addEventListener('dragstart', () => el.classList.add('dragging'));
      el.addEventListener('dragend', () => el.classList.remove('dragging'));
      safeZone.appendChild(el);
    });

    // 拖曳邏輯
    const zones = document.querySelectorAll('.drop-zone');
    zones.forEach(zone => {
      zone.addEventListener('dragover', e => {
        e.preventDefault();
        const dragging = document.querySelector('.dragging');
        const after = [...zone.querySelectorAll('.drag-item:not(.dragging)')].find(c => e.clientY < c.getBoundingClientRect().top + c.getBoundingClientRect().height/2);
        zone.insertBefore(dragging, after);
      });
    });
  }

  function submit() {
    // 取得玩家隔離的卡片
    const playerAnomaly = [...document.getElementById('anomaly-zone').querySelectorAll('.drag-item')]
                            .map(i => i.innerText).join(' ; ');
    
    // 正確答案轉為字串
    const correctStr = errorCards.join('|');

    document.getElementById('step-2').classList.add('hidden');
    document.getElementById('loading').classList.remove('hidden');

    // 調用精準判定函數
    google.script.run.withSuccessHandler(res => {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('step-3').classList.remove('hidden');
      document.getElementById('result').innerText = res;
    }).verifyResults(playerAnomaly, correctStr);
  }

  function revealAnswers() {
    const list = document.getElementById('answer-list');
    list.classList.remove('hidden');
    list.innerHTML = "<strong>🛑 真正的污染源（異常行為）：</strong><br>" + 
                     (errorCards.length > 0 ? errorCards.map(c => "• " + c).join("<br>") : "本次任務訊號極其純淨。");
    document.getElementById('show-answer-btn').classList.add('hidden');
  }
</script>
</body>
</html>
